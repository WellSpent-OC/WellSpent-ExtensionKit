name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  mac:
    name: Tests on the Mac
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test
  linux:
    name: Tests on Linux
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v4
      - run: swift test
